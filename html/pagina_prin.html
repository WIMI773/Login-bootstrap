<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Supermercado Mi Tienda</title>
  <link rel="stylesheet" href="../css/principal.css">
</head>
<body>

  <!-- Encabezado -->
  <header>
    <img src="../img/logoverde.png" alt="Logo Supermercado" />
    <nav>
      <a href="#">Inicio</a>
      <a href="#">Categorías</a>
      <a href="#">Ofertas</a>
      
      <a href="../index.html">Salir</a>
    </nav>
  </header>

  <!-- Carrusel -->
  <div class="carousel">
    <img src="../img/supermercado.jpg" alt="Promoción 1" />
  </div>

  

  <!-- Ofertas de la semana -->
  <section class="ofertas">
    <h2>Ofertas de la Semana</h2>
    <div class="productos">
      <div class="producto">
        <img src="../img/ron.jpg" width="" height="8" alt="Producto 1" />
        <h3>RON</h3>
        <H3>VIEJO DE CALDAS</H3>
        <p>$3.500</p>
      </div>
      <div class="producto">
        <img src="../img/aguardiente.jpg" alt="Producto 2" />
        <h3>AGUARDIENTE</h3>
        <H3>ANTIOQUEÑO</H3>
        <p>$50.000</p>
      </div>
      <div class="producto">
        <img src="../img/bucchanas.jpg" alt="Producto 3" />
        <h3>BUCHANA'S</h3>
        <H3>MATER</H3>
        <p>$200.000</p>
      </div>
    </div>
  </section>

  

</body>
</html>
